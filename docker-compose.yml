# pdlm — déploiement de production
#
# Seuls Caddy (80/443) est exposé. PostgreSQL, MinIO et l'app vivent sur le
# réseau interne. Le service `migrate` applique les migrations AVANT le
# démarrage de l'app (pas de synchronisation automatique de schéma en prod).
#
# Local (démo sans TLS) : CADDY_FILE par défaut = Caddyfile.dev (port 80).
# Production : CADDY_FILE=./Caddyfile + domaines réels (TLS automatique).
#
# Variables (fichier .env) : voir .env.example — POSTGRES_PASSWORD,
# PAYLOAD_SECRET, S3_APP_PASSWORD et MINIO_ROOT_PASSWORD obligatoires en prod.

# Nom de projet explicite : la pile de développement (docker-compose.dev.yml)
# occupe le projet `pdlm`. Sans ces deux noms distincts, les deux piles se
# disputent les mêmes conteneurs et les mêmes volumes.
name: pdlm-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdlm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdlm}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun port publié : réseau interne uniquement

  minio:
    # Épinglé par digest (reproductibilité + scan Trivy J8) — RELEASE.2025-09-07T16-13-09Z.
    # `latest` pouvait changer de version majeure entre deux déploiements.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun port publié (console comprise) : réseau interne uniquement

  createbuckets:
    # Épinglé par digest (mc 9.6, même raison que minio ci-dessus).
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-pdlm}
      S3_APP_PASSWORD: ${S3_APP_PASSWORD:-motdepasse-a-changer}
    # Idempotent : chaque étape tolère l'existant, et l'attachement de la
    # policy est INCONDITIONNEL. L'ancienne forme `policy create || policy
    # attach` ne rattachait jamais au premier démarrage (create réussissant,
    # attach était sauté) : l'utilisateur pdlm-app restait sans droits.
    # Le bucket n'est pas anonyme : les fichiers sont servis par Payload
    # (/api/media/file/…), jamais lus directement depuis MinIO.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::'"$$S3_BUCKET"'","arn:aws:s3:::'"$$S3_BUCKET"'/*"]}]}' > /tmp/policy.json
        mc admin policy create local pdlm-app /tmp/policy.json 2>/dev/null || echo "policy pdlm-app : déjà présente"
        mc admin user add local pdlm-app "$$S3_APP_PASSWORD" 2>/dev/null || echo "utilisateur pdlm-app : déjà présent"
        mc admin policy attach local pdlm-app --user pdlm-app 2>/dev/null || echo "policy pdlm-app : déjà attachée"
        echo "--- droits effectifs de pdlm-app ---"
        mc admin user info local pdlm-app

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Réseau interne : les URIs du .env (127.0.0.1) ne s'appliquent pas en prod
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pdlm}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requis dans .env}
      S3_ENABLED: 'false'
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pdlm}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requis dans .env}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: pdlm-app
      S3_SECRET_ACCESS_KEY: ${S3_APP_PASSWORD:-motdepasse-a-changer}
      S3_ENABLED: 'true'
      S3_BUCKET: ${S3_BUCKET:-pdlm}
      S3_REGION: ${S3_REGION:-fr-1}
      NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-http://localhost:9000}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      ADMIN_URL: ${ADMIN_URL:-http://localhost}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NODE_ENV: production
      # Mesure d'audience (profil « mesure ») : sans UMAMI_URL, la fonction n'existe pas.
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_TEAM_ID: ${UMAMI_TEAM_ID:-}
      UMAMI_PUBLIC_URL: ${UMAMI_PUBLIC_URL:-}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Aucun port publié : Caddy est l'unique point d'entrée

  # --- Mesure d'audience (profil « mesure », COMPOSE_PROFILES=mesure dans .env) ---
  # Jamais ${X:?} ici : Compose refuse alors toute la pile, même profil
  # inactif (vérifié le 23/09). Les variables manquantes sont refusées par
  # les conteneurs eux-mêmes.

  init-umami:
    # Rôle et base `umami`, idempotent. Les scripts d'initialisation de
    # Postgres ne tournent que sur un volume vide : sans ce service, une
    # installation existante n'aurait jamais la base.
    image: postgres:17-alpine
    profiles: [mesure]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-pdlm}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -n "$$UMAMI_DB_PASSWORD" ] || { echo "UMAMI_DB_PASSWORD requis dans .env" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v mdp="$$UMAMI_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami')\gexec
        ALTER ROLE umami WITH LOGIN PASSWORD :'mdp';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
        SQL
        echo "rôle et base umami : prêts"

  umami:
    # Épinglé par digest (reproductibilité + scan Trivy) — Umami 3.4.0.
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [mesure]
    restart: unless-stopped
    depends_on:
      init-umami:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      # IP déjà tronquée par le relais de pdlm (I18) ; géolocalisation par
      # en-têtes du client ignorée.
      CLIENT_IP_HEADER: x-pdlm-ip
      SKIP_LOCATION_HEADERS: '1'
    # Contrôle du secret, interface en français, puis commande d'origine de l'image.
    volumes:
      - ./scripts/umami-demarrer.sh:/pdlm/umami-demarrer.sh:ro
    command: ['sh', '/pdlm/umami-demarrer.sh']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # I22 : aucun port publié ; la collecte ne passe que par le relais de pdlm.

  purge-mesure:
    # I21 : aucune donnée de mesure de plus de 25 mois. Pas de tâche dans
    # l'application : pdlm n'a pas, et ne doit pas avoir, les identifiants de
    # la base `umami`.
    image: postgres:17-alpine
    profiles: [mesure]
    restart: unless-stopped
    depends_on:
      umami:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - ./scripts/purge-mesure.sql:/purge-mesure.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          psql -v ON_ERROR_STOP=1 -f /purge-mesure.sql || echo "ÉCHEC de la purge de la mesure d'audience (I21)" >&2
          sleep 86400
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${CADDY_FILE:-./Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    # TLS automatique par domaine via Let's Encrypt (Caddyfile prod)

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
