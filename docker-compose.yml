# pdlm — déploiement de production
#
# Seuls Caddy (80/443) est exposé. PostgreSQL, Garage et l'app vivent sur le
# réseau interne. Le service `migrate` applique les migrations AVANT le
# démarrage de l'app (pas de synchronisation automatique de schéma en prod).
#
# Local (démo sans TLS) : CADDY_FILE par défaut = Caddyfile.dev (port 80).
# Production : CADDY_FILE=./Caddyfile + domaines réels (TLS automatique).
#
# Variables (fichier .env) : voir .env.example — POSTGRES_PASSWORD,
# PAYLOAD_SECRET, S3_APP_PASSWORD, GARAGE_RPC_SECRET et GARAGE_ADMIN_TOKEN
# obligatoires en prod.

# Nom de projet explicite : la pile de développement (docker-compose.dev.yml)
# occupe le projet `pdlm`. Sans ces deux noms distincts, les deux piles se
# disputent les mêmes conteneurs et les mêmes volumes.
name: pdlm-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdlm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdlm}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun port publié : réseau interne uniquement

  garage:
    # Serveur S3 (Deuxfleurs) — remplace l'ancien serveur S3, retiré depuis
    # que ses images ne sont plus distribuées (19/11, notes-stockage-garage.md).
    # Épinglé par digest (reproductibilité + scan Trivy J8) — Garage v2.5.0.
    # Image « FROM scratch » : pas de shell — le healthcheck passe par le
    # binaire lui-même (`json-api` interroge l'instance locale par RPC, sans
    # authentification, sortie non nulle en cas d'erreur).
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    environment:
      # Secrets par variables d'environnement (lus par Garage depuis v0.8.2) ;
      # garage.toml, versionné, n'en contient aucun.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET requis dans .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN requis dans .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'json-api', 'GetClusterStatus']
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun port publié (API S3 3900, RPC 3901, admin 3903) : réseau interne
    # uniquement. Nœud unique : pas de RPC entre pairs, le secret protège
    # surtout l'entrée du cluster à toute future extension.

  init-s3:
    # Initialisation idempotente (remplace l'ancien `createbuckets`) : layout du
    # nœud unique, bucket, IMPORT de la clé de l'app, droits lecture+écriture
    # sans owner, quota. Rejouable : chaque étape tolère l'existant.
    # Image node alpine épinglée par digest : fetch + JSON natifs, aucun
    # paquet installé à l'exécution. Même base que le Dockerfile du dépôt.
    image: node:22.17.0-alpine@sha256:fc3e945f920b7e3000cd1af86c4ae406ec70c72f328b667baf0f3a8910d69eed
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN requis dans .env}
      S3_BUCKET: ${S3_BUCKET:-pdlm}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pdlm-app}
      S3_APP_PASSWORD: ${S3_APP_PASSWORD:-motdepasse-a-changer}
      # Quota dur du bucket (retouche Y). Vide par défaut : la production
      # n'a pas de raison de borner son stockage. La surcouche démo le pose
      # (DEMO_S3_QUOTA) : un quota borné y limite le disque qu'un relais
      # peut remplir avant la restauration nocturne. Idempotent.
      S3_QUOTA: ${S3_QUOTA:-}
    volumes:
      - ./scripts/garage-init.mjs:/garage-init.mjs:ro
      - ./scripts/garage-quota.mjs:/garage-quota.mjs:ro
    entrypoint: ['node', '/garage-init.mjs']
    # Le bucket n'est pas anonyme : les fichiers sont servis par Payload
    # (/api/media/file/…), jamais lus directement depuis Garage.

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Réseau interne : les URIs du .env (127.0.0.1) ne s'appliquent pas en prod
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pdlm}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requis dans .env}
      S3_ENABLED: 'false'
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      init-s3:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pdlm}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requis dans .env}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pdlm-app}
      S3_SECRET_ACCESS_KEY: ${S3_APP_PASSWORD:-motdepasse-a-changer}
      S3_ENABLED: 'true'
      S3_BUCKET: ${S3_BUCKET:-pdlm}
      S3_REGION: ${S3_REGION:-fr-1}
      NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-http://localhost:3900}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      ADMIN_URL: ${ADMIN_URL:-http://localhost}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NODE_ENV: production
      # Mesure d'audience (profil « mesure ») : sans UMAMI_URL, la fonction n'existe pas.
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_TEAM_ID: ${UMAMI_TEAM_ID:-}
      UMAMI_PUBLIC_URL: ${UMAMI_PUBLIC_URL:-}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Aucun port publié : Caddy est l'unique point d'entrée

  # --- Mesure d'audience (profil « mesure », COMPOSE_PROFILES=mesure dans .env) ---
  # Jamais ${X:?} ici : Compose refuse alors toute la pile, même profil
  # inactif (vérifié le 23/09). Les variables manquantes sont refusées par
  # les conteneurs eux-mêmes.

  init-umami:
    # Rôle et base `umami`, idempotent. Les scripts d'initialisation de
    # Postgres ne tournent que sur un volume vide : sans ce service, une
    # installation existante n'aurait jamais la base.
    image: postgres:17-alpine
    profiles: [mesure]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-pdlm}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -n "$$UMAMI_DB_PASSWORD" ] || { echo "UMAMI_DB_PASSWORD requis dans .env" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v mdp="$$UMAMI_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami')\gexec
        ALTER ROLE umami WITH LOGIN PASSWORD :'mdp';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
        SQL
        echo "rôle et base umami : prêts"

  umami:
    # Épinglé par digest (reproductibilité + scan Trivy) — Umami 3.4.0.
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [mesure]
    restart: unless-stopped
    depends_on:
      init-umami:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      # IP déjà tronquée par le relais de pdlm (I18) ; géolocalisation par
      # en-têtes du client ignorée.
      CLIENT_IP_HEADER: x-pdlm-ip
      SKIP_LOCATION_HEADERS: '1'
    # Contrôle du secret, interface en français, puis commande d'origine de l'image.
    volumes:
      - ./scripts/umami-demarrer.sh:/pdlm/umami-demarrer.sh:ro
    command: ['sh', '/pdlm/umami-demarrer.sh']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # I22 : aucun port publié ; la collecte ne passe que par le relais de pdlm.

  purge-mesure:
    # I21 : aucune donnée de mesure de plus de 25 mois. Pas de tâche dans
    # l'application : pdlm n'a pas, et ne doit pas avoir, les identifiants de
    # la base `umami`.
    image: postgres:17-alpine
    profiles: [mesure]
    restart: unless-stopped
    depends_on:
      umami:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - ./scripts/purge-mesure.sql:/purge-mesure.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        # depends_on est ignoré quand Docker relance les conteneurs (reboot) :
        # attendre Postgres, et réessayer vite après un échec plutôt qu'à J+1.
        while true; do
          until pg_isready -q; do sleep 5; done
          if psql -v ON_ERROR_STOP=1 -f /purge-mesure.sql; then
            sleep 86400
          else
            echo "ÉCHEC de la purge de la mesure d'audience (I21)" >&2
            sleep 300
          fi
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${CADDY_FILE:-./Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    # TLS automatique par domaine via Let's Encrypt (Caddyfile prod)

volumes:
  pgdata:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
