# pdlm — surcouche de l'instance de démonstration en ligne
#
# Usage : docker compose -f docker-compose.yml -f docker-compose.demo.yml …
# Le serveur cible a déjà un Caddy partagé — un CONTENEUR, que la procédure
# connecte au réseau `pdlm-demo-edge` ci-dessous : la pile de démo ne lance
# PAS son propre Caddy, et l'app y est jointe par son alias `pdlm-demo`
# (reverse_proxy pdlm-demo:3000). Les publications 127.0.0.1:3110 / [::1]:3110
# restent utiles pour contrôler depuis l'hôte. Procédure complète :
# docs/deploiement-demo.md.
#
# Isolation (retouche H) : la pile ne touche PAS `vps-network`, le réseau des
# autres sites du serveur — un conteneur de la pile n'y voit ni leur site ni
# leur base. Seul le Caddy partagé est connecté à `pdlm-demo-edge`, réseau
# créé et possédé par la pile. Les alias sans ambiguïté `pdlm-demo-postgres`
# et `pdlm-demo-minio` (retouche A) restent : défense en profondeur à coût
# nul, un éventuel `postgres` étranger n'entre jamais en concurrence.

services:
  postgres:
    networks:
      default:
        aliases:
          - pdlm-demo-postgres

  minio:
    networks:
      default:
        aliases:
          - pdlm-demo-minio

  migrate:
    environment:
      # Mêmes variables que docker-compose.yml, seul l'hôte change.
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pdlm-demo-postgres:5432/${POSTGRES_DB:-pdlm}

  app:
    # `default` explicite : poser `networks` sur un service le retire sinon du
    # réseau de la pile — il perdrait postgres et minio. `pdlm-demo-edge` porte
    # l'alias `pdlm-demo` : c'est là, et là seulement, que le Caddy partagé
    # trouve l'app.
    networks:
      default: {}
      pdlm-demo-edge:
        aliases:
          - pdlm-demo
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pdlm-demo-postgres:5432/${POSTGRES_DB:-pdlm}
      S3_ENDPOINT: http://pdlm-demo-minio:9000
    # Boucle locale seulement : rien n'est joignable depuis l'extérieur,
    # tout passe par le Caddy partagé du serveur.
    ports:
      - '127.0.0.1:3110:3000'
      - '[::1]:3110:3000'

  caddy:
    # Profil jamais activé : Compose ignore ce service tant que
    # COMPOSE_PROFILES ne vaut pas `desactive` — 80/443 restent au Caddy
    # partagé de l'hôte.
    profiles:
      - desactive

networks:
  # Réseau DÉDIÉ au dialogue Caddy partagé ↔ app de démo (retouche H). Nom
  # fixe : la procédure y connecte le conteneur Caddy du serveur, quel que
  # soit le projet Compose qui a créé la pile. Jamais dans le Compose du
  # Caddy partagé : absent au démarrage de celui-ci, il l'empêcherait de
  # démarrer — la connexion vit hors Compose, par `docker network connect`
  # (docs/deploiement-demo.md § 4).
  pdlm-demo-edge:
    name: pdlm-demo-edge
