# pdlm — surcouche de l'instance de démonstration en ligne
#
# Usage : docker compose -f docker-compose.yml -f docker-compose.demo.yml …
# Le serveur cible a déjà un Caddy partagé — un CONTENEUR sur le réseau Docker
# externe `vps-network` : la pile de démo ne lance PAS son propre Caddy, et
# l'app y est jointe par son alias `pdlm-demo` (reverse_proxy pdlm-demo:3000).
# Les publications 127.0.0.1:3110 / [::1]:3110 restent utiles pour contrôler
# depuis l'hôte. Procédure complète : docs/deploiement-demo.md.
#
# Le réseau partagé du serveur porte déjà un conteneur nommé `postgres` (base
# d'autres sites) : depuis `app`, attachée aux deux réseaux, ce nom serait
# ambigu. `postgres` et `minio` reçoivent donc des alias sans ambiguïté sur le
# réseau `default` de la pile, et les URIs pointent dessus (retouche A).

services:
  postgres:
    networks:
      default:
        aliases:
          - pdlm-demo-postgres

  minio:
    networks:
      default:
        aliases:
          - pdlm-demo-minio

  migrate:
    environment:
      # Mêmes variables que docker-compose.yml, seul l'hôte change.
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pdlm-demo-postgres:5432/${POSTGRES_DB:-pdlm}

  app:
    # `default` explicite : poser `networks` sur un service le retire sinon du
    # réseau de la pile — il perdrait postgres et minio.
    networks:
      default: {}
      vps-network:
        aliases:
          - pdlm-demo
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pdlm-demo-postgres:5432/${POSTGRES_DB:-pdlm}
      S3_ENDPOINT: http://pdlm-demo-minio:9000
    # Boucle locale seulement : rien n'est joignable depuis l'extérieur,
    # tout passe par le Caddy partagé du serveur.
    ports:
      - '127.0.0.1:3110:3000'
      - '[::1]:3110:3000'

  caddy:
    # Profil jamais activé : Compose ignore ce service tant que
    # COMPOSE_PROFILES ne vaut pas `desactive` — 80/443 restent au Caddy
    # partagé de l'hôte.
    profiles:
      - desactive

networks:
  # Externe : créé hors Compose par l'exploitant du serveur (réseau des
  # conteneurs exposés, dont le Caddy partagé). En essai local, le créer
  # d'abord : docker network create vps-network.
  vps-network:
    external: true
