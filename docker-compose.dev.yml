# Environnement de développement : PostgreSQL + MinIO uniquement.
# L'application tourne hors Docker (`npm run dev`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glm
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d glm']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Les images MinIO ont quitté Docker Hub — registre canonique : quay.io
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      # Console d'administration MinIO — développement uniquement, ne jamais exposer en production.
      - '9001:9001'
    volumes:
      - minio_dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/glm &&
      mc anonymous set download local/glm
      "

volumes:
  pgdata_dev:
  minio_dev:
