# Environnement de développement : PostgreSQL + MinIO uniquement.
# L'application tourne hors Docker (`npm run dev`).
#
# Nom de projet explicite : la pile de production (docker-compose.yml) occupe
# le projet `pdlm-prod`. Sans ces deux noms distincts, les deux piles se
# disputent les mêmes conteneurs et les mêmes volumes.
name: pdlm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdlm
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pdlm']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Les images MinIO ont quitté Docker Hub — registre canonique : quay.io
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      # Console d'administration MinIO — développement uniquement, ne jamais exposer en production.
      - '9001:9001'
    volumes:
      - minio_dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # I5 : téléchargement d'objet connu autorisé, listing et écriture
    # anonymes refusés. `mc anonymous set download` accorde à tort les DEUX
    # permissions s3:GetObject ET s3:ListBucket (constat de recette J9,
    # 2026-09-21 : listing anonyme du bucket entier possible en dev) — policy
    # JSON explicite, GetObject seul, pour se limiter à ce que I5 documente.
    #
    # Forme liste + bloc littéral `|` (pas `>` replié en une ligne d'espaces,
    # qui avait déjà silencieusement cassé une première version de ce script :
    # sans `&&` explicite entre chaque commande, tout finissait comme
    # arguments surnuméraires de la première — `mc alias set` seul, exit 0,
    # aucune des étapes suivantes exécutée). Même forme que le service
    # `createbuckets` de docker-compose.yml (prod), déjà correcte.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/pdlm
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::pdlm/*"]}]}' > /tmp/anon-policy.json
        mc anonymous set-json /tmp/anon-policy.json local/pdlm

  # Mesure d'audience : docker compose -f docker-compose.dev.yml --profile mesure up -d
  # puis, dans .env : UMAMI_URL=http://127.0.0.1:3002 (+ clé et équipe, README).
  init-umami:
    image: postgres:17-alpine
    profiles: [mesure]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pdlm
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami')\gexec
        ALTER ROLE umami WITH LOGIN PASSWORD 'umami';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
        SQL

  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [mesure]
    depends_on:
      init-umami:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:umami@postgres:5432/umami
      APP_SECRET: umami-dev-secret-sans-valeur
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      CLIENT_IP_HEADER: x-pdlm-ip
      SKIP_LOCATION_HEADERS: '1'
    # Interface en français par défaut (voir scripts/umami-demarrer.sh).
    volumes:
      - ./scripts/umami-demarrer.sh:/pdlm/umami-demarrer.sh:ro
    command: ['sh', '/pdlm/umami-demarrer.sh']
    ports:
      - '127.0.0.1:3002:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata_dev:
  minio_dev:
