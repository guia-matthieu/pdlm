# Environnement de développement : PostgreSQL + Garage uniquement.
# L'application tourne hors Docker (`npm run dev`).
#
# Nom de projet explicite : la pile de production (docker-compose.yml) occupe
# le projet `pdlm-prod`. Sans ces deux noms distincts, les deux piles se
# disputent les mêmes conteneurs et les mêmes volumes.
name: pdlm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdlm
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pdlm']
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    # Même image épinglée que la production (v2.5.0) — le développement doit
    # répliquer ce qui tourne en prod, pas une dérive « latest ».
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    environment:
      # Défauts de développement, valables ICI uniquement (la prod et la démo
      # exigent les vraies valeurs, voir docker-compose.yml). Le secret RPC
      # doit être de l'hexadécimal 32 octets : Garage le décode tel quel.
      GARAGE_RPC_SECRET: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      GARAGE_ADMIN_TOKEN: dev-admin-token
    ports:
      # API S3 pour `npm run dev` sur l'hôte (.env : S3_ENDPOINT=http://localhost:3900)
      - '3900:3900'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta_dev:/var/lib/garage/meta
      - garage_data_dev:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'json-api', 'GetClusterStatus']
      interval: 5s
      timeout: 3s
      retries: 10

  init-s3:
    # Même initialisation que la production, avec les valeurs de dev :
    # bucket pdlm, clé pdlm-app importée, droits lecture+écriture, pas de
    # quota. Plus AUCUN accès anonyme (l'ancienne policy de lecture publique
    # de dev disparaît) : les fichiers passent par Payload
    # (/api/media/file/…), en dev comme ailleurs.
    image: node:22.17.0-alpine@sha256:fc3e945f920b7e3000cd1af86c4ae406ec70c72f328b667baf0f3a8910d69eed
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: dev-admin-token
      S3_BUCKET: pdlm
      S3_ACCESS_KEY_ID: pdlm-app
      S3_APP_PASSWORD: motdepasse-a-changer
    volumes:
      - ./scripts/garage-init.mjs:/garage-init.mjs:ro
      - ./scripts/garage-quota.mjs:/garage-quota.mjs:ro
    entrypoint: ['node', '/garage-init.mjs']

  # Mesure d'audience : docker compose -f docker-compose.dev.yml --profile mesure up -d
  # puis, dans .env : UMAMI_URL=http://127.0.0.1:3002 (+ clé et équipe, README).
  init-umami:
    image: postgres:17-alpine
    profiles: [mesure]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pdlm
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami')\gexec
        ALTER ROLE umami WITH LOGIN PASSWORD 'umami';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
        SQL

  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [mesure]
    depends_on:
      init-umami:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:umami@postgres:5432/umami
      APP_SECRET: umami-dev-secret-sans-valeur
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      CLIENT_IP_HEADER: x-pdlm-ip
      SKIP_LOCATION_HEADERS: '1'
    # Interface en français par défaut (voir scripts/umami-demarrer.sh).
    volumes:
      - ./scripts/umami-demarrer.sh:/pdlm/umami-demarrer.sh:ro
    command: ['sh', '/pdlm/umami-demarrer.sh']
    ports:
      - '127.0.0.1:3002:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata_dev:
  garage_meta_dev:
  garage_data_dev:
